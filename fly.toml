# OmniRoute on Fly.io — change `app` if the name is taken
app = 'omin-joker'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile.fly'

[[mounts]]
  source = 'omniroute_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 20128
  force_https = true
  auto_stop_machines = 'off'     # stay online 24/7
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '60s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-4x'
  memory = '1gb'

[env]
  PORT = '20128'
  HOST = '0.0.0.0'
  DATA_DIR = '/data'
  OMNIROUTE_MEMORY_MB = '512'
  REQUIRE_API_KEY = 'true'
  # PUBLIC_URL auto = https://<app>.fly.dev ; set PUBLIC_URL for a custom domain
