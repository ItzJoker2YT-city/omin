services:
  # OmniRoute web service (dashboard + /v1 API on one port) — FREE plan
  - type: web
    name: omniroute
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /login
    envVars:
      - key: PORT
        value: "20128"
      - key: OMNIROUTE_MEMORY_MB
        value: "320"
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY_SECRET
        generateValue: true
      - key: OMNIROUTE_WS_BRIDGE_SECRET
        generateValue: true
      - key: INITIAL_PASSWORD
        sync: false          # Render asks you for this on first deploy
      - key: NEXT_PUBLIC_BASE_URL
        sync: false          # e.g. https://omniroute-xxxx.onrender.com
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: omniroute-redis
          property: connectionString

  # Redis for rate limiting / cache — FREE plan
  - type: keyvalue
    name: omniroute-redis
    plan: free
    ipAllowList: []          # only reachable from your Render services
