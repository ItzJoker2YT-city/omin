services:
  # OmniRoute web service (dashboard + /v1 API on one port) — FREE plan
  - type: web
    name: omniroute
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /login
    maxShutdownDelaySeconds: 90   # time to back up before deploy/restart
    envVars:
      - key: PORT
        value: "20128"
      - key: OMNIROUTE_MEMORY_MB
        value: "256"
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY_SECRET
        generateValue: true
      - key: STORAGE_ENCRYPTION_KEY
        generateValue: true
      - key: OMNIROUTE_WS_BRIDGE_SECRET
        generateValue: true
      - key: REQUIRE_API_KEY
        value: "true"
      - key: INITIAL_PASSWORD
        sync: false          # Render asks you for this on first deploy
      - key: PUBLIC_URL
        sync: false          # OPTIONAL: custom domain, e.g. https://omin.runhost.bond (leave blank to use *.onrender.com)
      - key: BACKUP_GITHUB_REPO
        value: ItzJoker2YT-city/omin-backup   # PRIVATE repo that stores encrypted backups
      - key: BACKUP_GITHUB_TOKEN
        sync: false          # fine-grained token: omin-backup repo, Contents read/write
      - key: BACKUP_PASSPHRASE
        generateValue: true  # encrypts backups — never change it after first backup
      - key: BACKUP_INTERVAL_MIN
        value: "1"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: omniroute-redis
          property: connectionString

  # Redis for rate limiting / cache — FREE plan
  - type: keyvalue
    name: omniroute-redis
    plan: free
    ipAllowList: []
